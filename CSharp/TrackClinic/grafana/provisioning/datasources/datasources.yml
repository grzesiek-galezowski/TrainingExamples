apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL:http://prometheus:9090}
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Zipkin
    type: zipkin
    access: proxy
    url: ${ZIPKIN_URL:http://zipkin:9411}
    editable: true
