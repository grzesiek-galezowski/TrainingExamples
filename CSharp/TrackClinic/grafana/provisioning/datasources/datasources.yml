apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus 
    access: proxy
    url: $PROMETHEUS_URL
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Zipkin
    type: zipkin
    uid: Zipkin
    access: proxy
    url: $ZIPKIN_URL
    editable: true
